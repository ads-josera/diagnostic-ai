# Un objeto de configuración con valores traducibles DEBE declarar su idioma.
# Sin esta línea, Drupal rechaza cada guardado del formulario con «must specify
# a language code», y el error solo aparece al enviarlo: fijar los valores por
# drush funciona igualmente, así que el fallo puede pasar desapercibido mucho
# tiempo si nadie usa el formulario.
langcode: es
# Sin personalizar de fábrica: los colores vacíos dejan la paleta por defecto
# del módulo, que ya está pensada para leerse bien en claro y en oscuro.
color_primary: ''
color_primary_hover: ''
color_accent: ''
welcome_text: ''
