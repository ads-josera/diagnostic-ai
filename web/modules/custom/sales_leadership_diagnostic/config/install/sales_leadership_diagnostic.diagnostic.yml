# Un objeto de configuración con valores traducibles DEBE declarar su idioma.
# Sin esta línea, Drupal rechaza cada guardado del formulario con «must specify
# a language code», y el error solo aparece al enviarlo: fijar los valores por
# drush funciona igualmente, así que el fallo puede pasar desapercibido mucho
# tiempo si nadie usa el formulario.
langcode: es
# Definición del agente de diagnóstico.
#
# El prompt, las instrucciones y la metodología son propiedad del cliente
# (§15) y se cargan desde la interfaz administrativa. Este archivo solo
# establece la estructura y la versión inicial.
#
# `version` identifica de forma inequívoca qué prompt e instrucciones se
# usaron en cada sesión (§57). Cambiarla es un acto deliberado.
version: '1.0'
system_prompt: ''
instructions: ''
output_contract: ''

# --- Pantalla de bienvenida del chat ---------------------------------------
# Lo que ve el alumno antes de escribir nada. Sin esto, la conversación
# arrancaba en blanco con un campo que pedía «tu respuesta» sin que nadie
# hubiera preguntado.
welcome_icon_fid: 0
welcome_intro: 'Diagnostica la madurez de tu organización comercial B2B utilizando evidencia, métricas y criterio ejecutivo. Identifica fortalezas, fugas, riesgos y las tres prioridades que más pueden mejorar tu sistema comercial.'
welcome_suggestions:
  - 'Quiero realizar mi diagnóstico comercial completo.'
  - 'Quiero volver a evaluar mi organización y comparar mi avance.'
  - 'Quiero evaluar sólo Forecast, Pipeline y Excelencia Operativa.'
  - 'Tengo información de mi CRM o Excel y quiero utilizarla en el diagnóstico.'
# Sin documentos de fábrica: la metodología la aporta el cliente.
knowledge_fids: {  }
