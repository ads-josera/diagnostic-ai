# Valores por defecto del módulo.
#
# ⚠ Este archivo se versiona en Git y es exportable con `drush cex`.
# NUNCA debe contener API keys, secretos ni tokens (§29).
# Los secretos se leen exclusivamente de variables de entorno.
wordpress:
  api_base_url: ''
  course_id: ''
  timeout: 10
  cache_ttl_granted: 900
  cache_ttl_denied: 60
  cache_grace_period: 3600
openai:
  # El identificador del modelo NUNCA se fija en el código (§30). El catálogo
  # se administra desde la interfaz para que anadir o retirar un modelo no
  # requiera un despliegue.
  model: ''
  available_models: {  }
  # Pesos por dolar, SOLO para enseñar la cifra al lado. No se usa para
  # calcular nada ni para los topes: el proveedor cobra en dolares y ese es el
  # numero que se guarda. Esta aqui porque el cliente razona en pesos y hacer
  # la cuenta a mano cada vez invita a equivocarse. Hay que actualizarlo a
  # mano; una conversion desactualizada se nota, una inventada no.
  exchange_rate: 17.0
  timeout: 60
  # Tarifas del proveedor, en DOLARES por millon de tokens. Viven aqui y no en
  # el codigo por el mismo motivo que el catalogo de modelos (§30): un cambio
  # de precios no puede exigir un despliegue, porque entonces los topes de
  # gasto quedarian calculados sobre tarifas viejas.
  #
  # Los tres precios son distintos y el del medio decide la cuenta: la entrada
  # que el proveedor ya tenia calculada se cobra al 10 %. Con una conversacion
  # larga eso es la mayor parte del recibo.
  #
  # Va como lista y no como mapa «modelo => tarifa» porque la configuracion de
  # Drupal no admite puntos en las claves, y todos los modelos los llevan.
  prices:
    - model: 'gpt-5.6-terra'
      input: 2.0
      cached_input: 0.2
      output: 12.0
  max_retries: 2
  # Techo de la respuesta del modelo, en tokens.
  #
  # 16 000 y no menos porque el Weekly GOLD Pack escribe el Pack DOS veces: en
  # Markdown para la persona, que es lo unico que lee, y en campos para que el
  # sistema pueda comprobarlo y guardarlo. Es inherente al diseno y no se puede
  # evitar componiendo la prosa nosotros: eso seria escribir su entregable.
  #
  # Medido el 10-09-2026 sobre 17 misiones Discovery: el turno que cierra ocupa
  # entre 7 100 y 8 000 tokens. Con el tope en 8 000, dos misiones de siete se
  # cortaron a la mitad y la respuesta se perdio entera. Las que si cerraron
  # pasaron a menos de 900 tokens del techo, que no es margen: es suerte.
  #
  # Subirlo no cuesta nada por si solo. Solo se paga lo que el modelo escribe,
  # y lo que escribe lo decide el contenido, no el techo.
  max_completion_tokens: 16000
# Topes de gasto del proveedor de IA, en DOLARES por mes natural.
#
# Cero significa SIN TOPE, que es lo que el modulo ha hecho siempre: activar un
# limite de fabrica cortaria el servicio en instalaciones que nunca pidieron
# uno. Se fijan en Configuracion -> Salesbumm -> Diagnostic AI -> Integracion.
#
# Van en dolares y no en pesos porque es lo que cobra el proveedor. El tipo de
# cambio de mas arriba es solo para enseñar la cifra al lado.
spending:
  per_user_limit: 0
  global_limit: 0
  # A partir de que porcentaje se avisa a quien administra. El alumno no nota
  # nada hasta el 100 %.
  warn_at_percent: 80

security:
  messages_per_window: 20
  window_seconds: 300
  max_diagnostics_per_day: 3
  max_turns: 40
  session_timeout: 3600
  sso_token_ttl: 90
  sso_token_leeway: 30

# Reglas de uso del diagnóstico.
diagnostic:
  # Por defecto sin límite, que es el comportamiento que el módulo ha tenido
  # siempre: activar un límite de fábrica cambiaría en silencio lo que ya
  # funciona en una instalación existente.
  repeat_policy: unlimited
  # Cero: no se purga nada. Una instalación existente no debe empezar a borrar
  # datos porque alguien actualice el módulo; activarlo es una decisión que
  # alguien tiene que tomar a sabiendas.
  conversation_retention_days: 0
  # Cuantos minutos puede tardar un turno en segundo plano antes de darlo por
  # atascado y devolver la conversacion a un estado en el que se pueda escribir.
  # Generoso a proposito: una mision que criba diez cuentas puede tardar veinte
  # minutos de trabajo legitimo, y desatascarla a mitad seria peor que el
  # problema.
  stuck_turn_minutes: 45

# Topes de las herramientas. A diferencia de los de gasto, estos SI nacen con
# valores: la herramienta solo existe si alguien enciende la busqueda a
# proposito, asi que un tope de fabrica no puede sorprender a nadie, y el §6 de
# la especificacion del cliente pide denegar «de forma determinista».
#
# Los numeros son de partida y hay que calibrarlos con el benchmark, como pide
# su §9. Cero significa sin tope.
tools:
  # CALIBRADOS CON 18 MISIONES DISCOVERY REALES el 10-09-2026, como pide su §9.
  # Lo medido, con `bin/benchmark.php`:
  #
  #                  minimo  mediana     p90   maximo
  #   busquedas           8       16      22       25
  #   caracteres     21 020   56 513  78 398   89 487
  #
  # Los topes van sobre el p90 con holgura, NO sobre la media: la media deja
  # fuera a la mitad de las misiones.
  #
  # Y se yerra por ARRIBA a proposito, porque los dos errores no cuestan lo
  # mismo. Un tope alto de mas deja que una mision rara gaste un poco mas, y el
  # gasto ya lo acotan el entitlement —una mision por persona y semana— y el
  # tope en dolares. Un tope bajo de mas hace que el agente investigue a
  # medias, y eso NO se ve: declara honestamente lo que no pudo verificar,
  # exactamente igual que cuando termina bien.
  #
  # Por mision: 40 es 1,8 veces el p90 y 1,6 veces la mision mas cara medida.
  max_calls_per_mission: 40
  # Caracteres de contenido externo que pueden entrar al modelo en una mision.
  # Es donde esta la mayor parte de lo que cuesta buscar: unos 3 500 por
  # busqueda medidos. 160 000 son 2 veces el p90.
  max_retrieved_chars_per_mission: 160000
  # Por persona y mes. NO es redundante con el de la mision: sin este, el tope
  # se salta abriendo otra conversacion, que es el bypass que nombra su §6.
  #
  # 200 = cinco misiones a la mas cara medida (25), mas las comprobaciones
  # puntuales. Con una mision por semana, nadie legitimo se acerca. Este tope
  # es el unico que se ha visto disparar de verdad: lo hizo el benchmark al
  # correr veinte misiones con una sola persona, que son cinco veces lo que el
  # sistema concede a nadie.
  max_calls_per_user_period: 200

# Busqueda externa. El agente solo busca si hay clave del buscador en el
# entorno del servidor; sin ella lo declara y sigue con lo que no dependa de
# ello, que es lo que manda su metodologia.
search:
  # Nace APAGADO. Encenderlo cambia lo que el agente puede hacer y lo que
  # cuesta cada turno, y eso no debe pasar por instalar una version.
  enabled: false
  # Cuantas veces puede pedir herramientas el modelo en un mismo turno. Es un
  # techo de gasto disfrazado: cada vuelta es una llamada mas y, con busqueda,
  # varias busquedas mas.
  #
  # Medido sobre 18 misiones: la que mas vueltas dio uso siete. 15 es el doble,
  # y por el mismo motivo que los de arriba se deja holgado: quedarse una
  # vuelta corto produce un Pack a medias que nadie distingue de uno completo.
  #
  # Ahora que estos turnos corren en segundo plano, subirlo ya no alarga
  # ninguna espera en una peticion web.
  max_tool_rounds: 15
  # Resultados por busqueda. El texto recuperado es la mayor parte de lo que
  # cuesta buscar.
  max_results: 5
  # 'basic' o 'advanced'. La avanzada consume mas creditos por consulta.
  depth: basic
  timeout: 20

# Research Entitlement: quien puede investigar y cuando. La renovacion es
# semanal y se calcula con la zona horaria de cada persona, no con la del
# servidor (§2 de la especificacion del cliente).
research:
  # Comprobaciones puntuales que quedan tras cerrar la mision de la semana.
  # Es lo que hace util el estado TARGETED_ONLY: permite resolver un bloqueo
  # concreto sin resetear la mision.
  max_rechecks_per_period: 3
  # A partir de cuantos dias una evidencia guardada se marca STALE al leerla.
  # No se guarda ese estado: se deduce al consultar, porque una evidencia no
  # cambia de naturaleza porque nadie haya pasado a revisarla.
  evidence_stale_days: 30
