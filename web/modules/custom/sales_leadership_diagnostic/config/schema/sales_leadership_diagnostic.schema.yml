sales_leadership_diagnostic.settings:
  type: config_object
  label: 'Ajustes de Sales Leadership Diagnostic AI'
  mapping:
    wordpress:
      type: mapping
      label: 'Integración WordPress / LearnDash'
      mapping:
        api_base_url:
          type: string
          label: 'URL base de la API de WordPress'
        course_id:
          type: string
          label: 'ID del curso/producto que autoriza el diagnóstico'
        timeout:
          type: integer
          label: 'Timeout de las peticiones a WordPress (segundos)'
        cache_ttl_granted:
          type: integer
          label: 'TTL de cache para autorizaciones concedidas (segundos)'
        cache_ttl_denied:
          type: integer
          label: 'TTL de cache para autorizaciones denegadas (segundos)'
        cache_grace_period:
          type: integer
          label: 'Periodo de gracia si WordPress no responde (segundos)'
    openai:
      type: mapping
      label: 'Proveedor de IA'
      mapping:
        model:
          type: string
          label: 'Modelo en uso'
        available_models:
          type: sequence
          label: 'Catálogo de modelos disponibles'
          sequence:
            type: string
            label: 'Identificador del modelo'
        timeout:
          type: integer
          label: 'Timeout de las peticiones al proveedor (segundos)'
        max_retries:
          type: integer
          label: 'Número máximo de reintentos ante errores transitorios'
        max_completion_tokens:
          type: integer
          label: 'Tokens máximos por respuesta'
    diagnostic:
      type: mapping
      label: 'Reglas de uso del diagnóstico'
      mapping:
        repeat_policy:
          # Decisión comercial, no técnica: define si el diagnóstico se vende
          # como herramienta de seguimiento o como entregable de cada compra.
          type: string
          label: 'Cuántos diagnósticos puede hacer un alumno'

    security:
      type: mapping
      label: 'Seguridad y límites de uso'
      mapping:
        messages_per_window:
          type: integer
          label: 'Mensajes permitidos por ventana y usuario'
        window_seconds:
          type: integer
          label: 'Duración de la ventana de rate limiting (segundos)'
        max_diagnostics_per_day:
          type: integer
          label: 'Diagnósticos que un alumno puede iniciar por día'
        max_turns:
          type: integer
          label: 'Turnos máximos por diagnóstico'
        session_timeout:
          type: integer
          label: 'Tiempo de inactividad que cierra una sesión de diagnóstico (segundos)'
        sso_token_ttl:
          type: integer
          label: 'Vigencia máxima aceptada del token SSO (segundos)'
        sso_token_leeway:
          type: integer
          label: 'Tolerancia de desfase de reloj al validar el token SSO (segundos)'

sales_leadership_diagnostic.diagnostic:
  type: config_object
  label: 'Definición del agente de diagnóstico'
  # El prompt, las instrucciones y el contrato de salida se declaran como
  # `string` y no como `text` de forma deliberada.
  #
  # En el esquema de configuración de Drupal, `text` marca un valor como
  # traducible y lo expone al sistema de traducción de configuración. Eso sería
  # incorrecto aquí: dos traducciones del mismo prompt bajo una misma versión
  # producirían diagnósticos distintos imposibles de reproducir, rompiendo la
  # trazabilidad que exige §57.
  #
  # Un diagnóstico en otro idioma debe modelarse como una definición y una
  # versión propias —la evolución hacia N diagnósticos que contempla §56—, no
  # como una traducción de esta.
  mapping:
    version:
      type: string
      label: 'Versión del diagnóstico'
    system_prompt:
      type: string
      label: 'Prompt principal (propiedad del cliente)'
    instructions:
      type: string
      label: 'Instrucciones del agente (propiedad del cliente)'
    output_contract:
      type: string
      label: 'Contrato de salida (añadido técnico)'

    # --- Pantalla de bienvenida del chat -----------------------------------
    # Lo que ve el alumno antes de escribir nada. A diferencia del prompt, que
    # es una instrucción para el modelo, esto es texto que lee una persona: por
    # eso aquí sí es correcto declararlo traducible.
    welcome_icon_fid:
      type: integer
      label: 'Icono de la pantalla de bienvenida'
    welcome_intro:
      type: text
      label: 'Texto introductorio del chat'
    welcome_suggestions:
      type: sequence
      label: 'Sugerencias para empezar'
      sequence:
        type: label
    # Documentos que el agente lee como metodología autorizada. Aquí viaja
    # solo la LISTA: el texto extraído vive en el estado, porque son cientos
    # de miles de caracteres de material propietario que no deben acabar en
    # Git en cada exportación de configuración.
    knowledge_fids:
      type: sequence
      label: 'Documentos de conocimiento'
      sequence:
        type: integer
        label: 'Identificador del archivo'

# Personalización visual (§4). Vive en su propio objeto de configuración y no
# junto a los ajustes de integración: son cosas que cambian por motivos
# distintos y que suele tocar gente distinta.
sales_leadership_diagnostic.branding:
  type: config_object
  label: 'Marca del diagnóstico'
  mapping:
    color_primary:
      type: string
      label: 'Color principal'
    color_primary_hover:
      type: string
      label: 'Color principal al pasar el ratón'
    color_accent:
      type: string
      label: 'Color de acento'
    welcome_text:
      type: text
      label: 'Mensaje de bienvenida del panel'

# Portada del sitio. Objeto propio y no una sección de «branding» porque son
# cosas distintas: la marca aplica a todo el módulo, y esto es el contenido de
# una única página.
sales_leadership_diagnostic.home:
  type: config_object
  label: 'Portada del sitio'
  mapping:
    background_fid:
      type: integer
      label: 'Imagen de fondo'
    logo_light_fid:
      type: integer
      label: 'Logotipo de la cabecera (fondo oscuro)'
    logo_color_fid:
      type: integer
      label: 'Logotipo del pie (fondo claro)'
    title:
      type: label
      label: 'Titular'
    intro:
      type: text
      label: 'Texto de presentación'
    button_label:
      type: label
      label: 'Etiqueta del botón principal'
    help_text:
      type: text
      label: 'Aclaración bajo el botón'
    accent_color:
      type: string
      label: 'Color de acento'
    band_color:
      type: string
      label: 'Color de la banda del pie'

# Un agente de diagnóstico. Entidad de configuración: se exporta, se despliega
# y se versiona como cualquier otra definición del producto.
#
# El prompt, las instrucciones y el contrato se declaran `string` y NO `text`,
# por el mismo motivo que en el objeto de configuración anterior: `text` los
# marcaría como traducibles, y dos traducciones de una misma versión
# producirían diagnósticos distintos imposibles de reproducir (§57). Un agente
# en otro idioma es otro agente, no una traducción de este.
sales_leadership_diagnostic.agent.*:
  type: config_entity
  label: 'Agente de diagnóstico'
  mapping:
    id:
      type: machine_name
      label: 'Identificador'
    label:
      type: label
      label: 'Nombre'
    version:
      type: string
      label: 'Versión de la metodología'
    course_id:
      type: string
      label: 'Curso de WordPress que lo concede'
    description:
      type: text
      label: 'Descripción interna'
    system_prompt:
      type: string
      label: 'Prompt principal (propiedad del cliente)'
    instructions:
      type: string
      label: 'Instrucciones de conducción (propiedad del cliente)'
    output_contract:
      type: string
      label: 'Contrato de salida (añadido técnico)'
    knowledge_fids:
      type: sequence
      label: 'Documentos de conocimiento'
      sequence:
        type: integer
        label: 'Identificador del archivo'
    welcome_icon_fid:
      type: integer
      label: 'Icono de la pantalla de bienvenida'
    welcome_intro:
      type: text
      label: 'Texto introductorio del chat'
    welcome_suggestions:
      type: sequence
      label: 'Sugerencias para empezar'
      sequence:
        type: label
    weight:
      type: integer
      label: 'Orden'
