name: 'Sales Leadership Diagnostic AI'
type: module
description: 'Experiencia privada de diagnóstico de liderazgo comercial mediante IA. La identidad y la autorización se delegan en WordPress/LearnDash; el motor de diagnóstico se ejecuta contra un proveedor de IA configurable.'
package: 'Salesbumm'
core_version_requirement: ^11
configure: sales_leadership_diagnostic.settings
dependencies:
  - drupal:system
  - drupal:user
  # Aporta el tipo de campo list_string que usa el estado de la sesión. El
  # perfil standard lo activa, de modo que la falta de esta declaración no se
  # notaba en desarrollo; en una instalación mínima el módulo no habría podido
  # instalarse. Lo detectaron los tests de Kernel, que arrancan solo con lo
  # declarado aquí.
  - drupal:options
  # Necesario para subir las imágenes de la portada y el icono del chat. Se
  # declara aunque el perfil standard lo active: una instalación mínima no lo
  # trae, y sin él esos formularios fallarían al construirse.
  - drupal:file
  - externalauth:externalauth
