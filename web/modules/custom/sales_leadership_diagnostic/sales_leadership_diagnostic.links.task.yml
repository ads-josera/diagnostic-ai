# ---------------------------------------------------------------------------
# Pestañas del gestor
# ---------------------------------------------------------------------------
# Las de arriba cuelgan de la página de ajustes, que exige ser administrador.
# El gestor no puede acceder a esa página, asi que esas pestañas NO se le
# pintan nunca: podia entrar al estudio escribiendo la URL, pero no habia un
# solo enlace que le llevara.
#
# Por eso el estudio y la bienvenida cuelgan de su listado de resultados, que
# es donde aterriza al iniciar sesión, y NO de la página de ajustes.
#
# Una ruta solo puede pertenecer a UN conjunto de pestañas. Declararla en dos
# hace que Drupal pinte los dos conjuntos a la vez y las pestañas aparezcan
# repetidas, que es lo que ocurrió al intentar servir a los dos públicos con
# declaraciones separadas.
#
# El reparto queda así, y se lee solo:
#
#   Contenido → Resultados    Resultados · Estudio · Bienvenida   (gestor)
#   Configuración → Salesbumm Integración · Agente · Marca        (admin)
#
# Un administrador llega igualmente al estudio: tiene el permiso, y el listado
# de resultados está en su menú de Contenido.
sales_leadership_diagnostic.results_default_tab:
  title: 'Resultados'
  route_name: sales_leadership_diagnostic.admin_results
  base_route: sales_leadership_diagnostic.admin_results
  weight: 0

