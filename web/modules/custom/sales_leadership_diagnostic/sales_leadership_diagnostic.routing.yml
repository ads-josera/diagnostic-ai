# ---------------------------------------------------------------------------
# Rutas del alumno
# ---------------------------------------------------------------------------
# Punto de entrada desde WordPress. Es la única ruta pública del módulo, y lo
# es por necesidad: quien llega todavía no tiene sesión en Drupal. El token
# firmado ES la autenticación, y el controlador aplica además un límite de
# intentos por dirección IP.
sales_leadership_diagnostic.sso:
  path: '/sales-diagnostic/sso'
  methods: [GET]
  defaults:
    _controller: '\Drupal\sales_leadership_diagnostic\Controller\SsoController::login'
    _title: 'Acceso al diagnóstico'
  requirements:
    # Pública por necesidad: quien llega todavía no tiene sesión en Drupal. El
    # token firmado ES la autenticación, y el controlador aplica además un
    # límite de intentos por dirección IP.
    _access: 'TRUE'
  options:
    no_cache: TRUE

# Explicación de por qué no se pudo entrar. Pública y sin token en la URL: es
# el destino al que redirige cualquier rechazo del SSO.
sales_leadership_diagnostic.sso_denied:
  path: '/sales-diagnostic/sin-acceso'
  methods: [GET]
  defaults:
    _controller: 'Drupal\sales_leadership_diagnostic\Controller\SsoController::denied'
    _title: 'Acceso al diagnóstico'
  requirements:
    # Pública a propósito: es el destino al que redirige un rechazo del SSO, y
    # quien llega aquí por definición no ha conseguido iniciar sesión. No
    # muestra ningún dato: solo un mensaje explicativo elegido de una lista
    # cerrada de motivos.
    _access: 'TRUE'

# El resto de rutas del alumno exigen la cadena completa: permiso, procedencia
# de WordPress y derecho al curso vigente.
sales_leadership_diagnostic.dashboard:
  path: '/sales-diagnostic'
  defaults:
    _controller: '\Drupal\sales_leadership_diagnostic\Controller\DashboardController::view'
    _title: 'Sales Leadership Diagnostic AI'
  requirements:
    _permission: 'access sales leadership diagnostic'
    # Sin barra invertida inicial: el ID del servicio se registra sin ella, y con
    # ella el contenedor no lo encuentra e instancia la clase sin argumentos.
    _custom_access: 'Drupal\sales_leadership_diagnostic\Access\DiagnosticAccessCheck::access'

# Página de un agente: su presentación y su historial.
#
# Segundo nivel de la navegación del alumno, y solo se usa cuando tiene varios
# agentes: con uno solo, el panel lo enseña todo y nadie llega aquí.
#
# Que el agente viaje en la URL no autoriza a verlo. El control de acceso de
# las rutas del alumno comprueba que tenga acceso al diagnóstico; que tenga
# derecho a ESTE agente lo comprueba el controller, que es quien puede cruzar
# los cursos que posee con el curso que lo concede.
sales_leadership_diagnostic.agent_page:
  path: '/sales-diagnostic/agente/{sld_agent}'
  defaults:
    _controller: 'Drupal\sales_leadership_diagnostic\Controller\AgentPageController::view'
    # El título sale del agente: con varios, uno común los volvería
    # indistinguibles en las pestañas y en los marcadores.
    _title_callback: 'Drupal\sales_leadership_diagnostic\Controller\AgentPageController::title'
  requirements:
    _permission: 'access sales leadership diagnostic'
    # Sin barra invertida inicial: el ID del servicio se registra sin ella, y con
    # ella el contenedor no lo encuentra e instancia la clase sin argumentos.
    _custom_access: 'Drupal\sales_leadership_diagnostic\Access\DiagnosticAccessCheck::access'

# Inicio de un diagnóstico.
#
# Solo POST y con token CSRF: crear una sesión cambia el estado del sistema, y
# con GET la crearía cualquier cosa que precargue enlaces —el navegador, un
# antivirus que inspecciona el correo, un rastreador—. El token impide además
# que otro sitio la dispare desde el navegador del alumno.
sales_leadership_diagnostic.start:
  # El agente viaja en la ruta. Que este en la URL no lo autoriza: quien
  # comprueba que el alumno tiene derecho a ESE agente es DiagnosticStarter,
  # que vuelve a preguntarselo a WordPress antes de crear nada.
  path: '/sales-diagnostic/start/{sld_agent}'
  methods: [POST]
  defaults:
    _controller: 'Drupal\sales_leadership_diagnostic\Controller\StartController::start'
  requirements:
    _permission: 'access sales leadership diagnostic'
    _custom_access: 'Drupal\sales_leadership_diagnostic\Access\DiagnosticAccessCheck::access'
    _csrf_token: 'TRUE'

# El alumno olvida un hecho concreto de su memoria.
#
# POST y con token, como el inicio: borra datos, y con GET lo dispararia
# cualquier cosa que precargue enlaces. Quien puede borrar lo decide el
# control de acceso de la entidad, que solo se lo permite a su dueño.
sales_leadership_diagnostic.memory_forget:
  path: '/sales-diagnostic/memoria/{sld_student_memory}/olvidar'
  methods: [POST]
  defaults:
    _controller: 'Drupal\sales_leadership_diagnostic\Controller\StudentMemoryController::forget'
  requirements:
    _entity_access: 'sld_student_memory.delete'
    _csrf_token: 'TRUE'

# El alumno olvida toda su memoria de una vez.
sales_leadership_diagnostic.memory_forget_all:
  path: '/sales-diagnostic/memoria/olvidar-todo'
  methods: [POST]
  defaults:
    _controller: 'Drupal\sales_leadership_diagnostic\Controller\StudentMemoryController::forgetAll'
  requirements:
    _permission: 'access sales leadership diagnostic'
    _csrf_token: 'TRUE'

# Vista de conversación.
#
# El nombre del parámetro coincide con el ID del tipo de entidad, así que
# Drupal lo resuelve a entidad automáticamente y _entity_access aplica el
# handler de acceso ANTES de invocar el controller: un identificador ajeno
# devuelve 403 sin que se ejecute una sola línea del módulo. Ahí está la
# protección contra IDOR (§35, §42).
sales_leadership_diagnostic.session:
  path: '/sales-diagnostic/session/{sld_diagnostic_session}'
  defaults:
    _controller: '\Drupal\sales_leadership_diagnostic\Controller\ChatController::view'
    # Este título es el <h1> de la página y el de la pestaña del navegador. La
    # plantilla no imprime otro: dos <h1> idénticos rompen el esquema del
    # documento y se anuncian dos veces en un lector de pantalla.
    _title: 'Sales Leadership Diagnostic AI'
  requirements:
    _permission: 'access sales leadership diagnostic'
    # Sin barra invertida inicial: el ID del servicio se registra sin ella, y con
    # ella el contenedor no lo encuentra e instancia la clase sin argumentos.
    _custom_access: 'Drupal\sales_leadership_diagnostic\Access\DiagnosticAccessCheck::access'
    _entity_access: 'sld_diagnostic_session.view'

# Envío de un mensaje. Devuelve JSON; lo consume el chat por fetch.
#
# Exige acceso de ACTUALIZACIÓN sobre la sesión, no de lectura: enviar un
# mensaje la modifica. Así, alguien con permiso para consultar diagnósticos
# ajenos —el personal de soporte— puede leerlos pero no escribir en ellos.
#
# El token CSRF viaja en la cabecera X-CSRF-Token, que es el mecanismo que
# core usa para endpoints JSON; el navegador lo obtiene de /session/token.
sales_leadership_diagnostic.session_message:
  path: '/sales-diagnostic/session/{sld_diagnostic_session}/message'
  methods: [POST]
  defaults:
    _controller: '\Drupal\sales_leadership_diagnostic\Controller\ConversationApiController::send'
  requirements:
    _permission: 'access sales leadership diagnostic'
    # Sin barra invertida inicial: el ID del servicio se registra sin ella, y con
    # ella el contenedor no lo encuentra e instancia la clase sin argumentos.
    _custom_access: 'Drupal\sales_leadership_diagnostic\Access\DiagnosticAccessCheck::access'
    _entity_access: 'sld_diagnostic_session.update'
    _csrf_request_header_token: 'TRUE'

# Resultado de un diagnóstico.
#
# No existe una ruta /sales-diagnostic/results aparte, pese a figurar en el
# encargo: el panel YA es el historial (§36, §37). Duplicar esa lista en otra
# página añadiría mantenimiento sin dar nada nuevo al alumno, y dos vistas del
# mismo dato tienden a divergir con el tiempo.
sales_leadership_diagnostic.result:
  path: '/sales-diagnostic/results/{sld_diagnostic_result}'
  methods: [GET]
  defaults:
    _controller: 'Drupal\sales_leadership_diagnostic\Controller\ResultsController::view'
    _title_callback: 'Drupal\sales_leadership_diagnostic\Controller\ResultsController::title'
  requirements:
    # Deliberadamente SIN _permission aquí: el permiso de alumno lo exige
    # accessResult() para los alumnos, pero el personal de soporte llega con
    # otro permiso distinto y exigir ambos lo dejaría fuera. Quién puede ver
    # QUÉ resultado lo decide _entity_access, que es donde vive la regla.
    _custom_access: 'Drupal\sales_leadership_diagnostic\Access\DiagnosticAccessCheck::accessResult'
    _entity_access: 'sld_diagnostic_result.view'

# ---------------------------------------------------------------------------
# Listado de resultados para administración y soporte
# ---------------------------------------------------------------------------
# Vive bajo /admin/content porque lista contenido, no configuración. Meterlo
# en /admin/config/salesbumm habría agrupado la sección, pero mezcla dos cosas
# que Drupal separa a propósito: ajustes que se exportan y datos que no.
sales_leadership_diagnostic.admin_results:
  path: '/admin/content/sales-diagnostic'
  methods: [GET]
  defaults:
    _controller: 'Drupal\sales_leadership_diagnostic\Controller\AdminResultsController::view'
    _title: 'Resultados de diagnóstico'
  requirements:
    _permission: 'view all diagnostic results+administer sales leadership diagnostic'

# ---------------------------------------------------------------------------
# Administración
# ---------------------------------------------------------------------------
# Sección propia dentro de /admin/config.
#
# Agrupar aquí la configuración de Salesbumm evita mezclarla con la de Drupal
# core y deja sitio a futuras herramientas del cliente sin reorganizar el menú.
sales_leadership_diagnostic.admin_section:
  path: '/admin/config/salesbumm'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Salesbumm'
  requirements:
    _permission: 'administer sales leadership diagnostic'

sales_leadership_diagnostic.settings:
  path: '/admin/config/salesbumm/diagnostic'
  defaults:
    _form: '\Drupal\sales_leadership_diagnostic\Form\SettingsForm'
    _title: 'Sales Leadership Diagnostic AI'
  requirements:
    _permission: 'administer sales leadership diagnostic'

# ---------------------------------------------------------------------------
# Estudio del prompt
# ---------------------------------------------------------------------------
# Editor a la izquierda, conversación de prueba a la derecha. Protegido por un
# permiso propio: quien define cómo conversa el agente no necesita ver los
# secretos ni la integración con WordPress.
sales_leadership_diagnostic.studio:
  path: '/admin/config/salesbumm/diagnostic/estudio'
  methods: [GET, POST]
  defaults:
    _controller: 'Drupal\sales_leadership_diagnostic\Controller\PromptStudioController::view'
    _title: 'Estudio del prompt'
  requirements:
    _permission: 'edit diagnostic prompt+administer sales leadership diagnostic'

# Mismo estudio, para un agente concreto. La pestana apunta a la ruta sin
# parametro, que entra directa si solo hay un agente y pregunta si hay varios;
# esta existe para poder enlazar a cada uno. Mismo patron que los documentos.
sales_leadership_diagnostic.studio_agent:
  path: '/admin/config/salesbumm/diagnostic/estudio/agente/{sld_agent}'
  methods: [GET, POST]
  defaults:
    _controller: 'Drupal\sales_leadership_diagnostic\Controller\PromptStudioController::view'
    _title: 'Estudio del prompt'
  requirements:
    _permission: 'edit diagnostic prompt+administer sales leadership diagnostic'

# Descarta la conversación de ensayo y empieza otra.
sales_leadership_diagnostic.studio_reset:
  path: '/admin/config/salesbumm/diagnostic/estudio/reiniciar/{sld_agent}'
  methods: [POST]
  defaults:
    _controller: 'Drupal\sales_leadership_diagnostic\Controller\PromptStudioController::reset'
  requirements:
    _permission: 'edit diagnostic prompt+administer sales leadership diagnostic'
    _csrf_token: 'TRUE'

# Envío de un turno del ensayo.
#
# Reutiliza el MISMO controlador que el chat del alumno a propósito: ensayar
# por otro camino probaría otra cosa. Lo que cambia es quién puede entrar, y de
# eso se encarga SandboxSessionCheck, que además exige que la sesión sea de
# prueba y propia.
sales_leadership_diagnostic.studio_message:
  path: '/admin/config/salesbumm/diagnostic/estudio/mensaje/{sld_diagnostic_session}'
  methods: [POST]
  defaults:
    _controller: '\Drupal\sales_leadership_diagnostic\Controller\ConversationApiController::send'
  requirements:
    _custom_access: 'Drupal\sales_leadership_diagnostic\Access\SandboxSessionCheck::access'
    _csrf_request_header_token: 'TRUE'

sales_leadership_diagnostic.branding:
  path: '/admin/config/salesbumm/diagnostic/marca'
  defaults:
    _form: '\Drupal\sales_leadership_diagnostic\Form\BrandingForm'
    _title: 'Marca'
  requirements:
    _permission: 'administer sales leadership diagnostic'

# Portada del sitio. Pública: quien llega puede no haber entrado nunca.
sales_leadership_diagnostic.welcome:
  path: '/bienvenida'
  methods: [GET]
  defaults:
    _controller: 'Drupal\sales_leadership_diagnostic\Controller\WelcomeController::view'
    _title: 'Diagnóstico de liderazgo comercial'
  requirements:
    # No muestra ningún dato: solo un mensaje fijo y un enlace de vuelta.
    _access: 'TRUE'

# Pantalla de bienvenida del chat. La administra el gestor: son textos de
# negocio, no ajustes de la instalación.
# Contenido de la portada. Lo administra quien lleva la marca del cliente.
sales_leadership_diagnostic.home_settings:
  path: '/admin/config/salesbumm/diagnostic/portada'
  defaults:
    _form: 'Drupal\sales_leadership_diagnostic\Form\HomePageForm'
    _title: 'Portada'
  requirements:
    _permission: 'administer sales leadership diagnostic'

# Documentos de conocimiento del agente.
#
# Mismo permiso que el estudio del prompt: los documentos son metodologia
# igual que el prompt, y quien define como diagnostica el agente es la misma
# persona. Separarlos habria obligado a dar dos permisos para una sola tarea.
sales_leadership_diagnostic.knowledge:
  path: '/admin/config/salesbumm/diagnostic/documentos'
  defaults:
    _form: 'Drupal\sales_leadership_diagnostic\Form\KnowledgeDocumentsForm'
    _title: 'Documentos de conocimiento'
  requirements:
    _permission: 'edit diagnostic prompt+administer sales leadership diagnostic'

# Misma pantalla de documentos, para un agente concreto. La pestana apunta a
# la ruta sin parametro, que resuelve el primer agente; esta existe para poder
# enlazar a cada uno cuando haya varios.
sales_leadership_diagnostic.knowledge_agent:
  path: '/admin/config/salesbumm/diagnostic/documentos/{sld_agent}'
  defaults:
    _form: 'Drupal\sales_leadership_diagnostic\Form\KnowledgeDocumentsForm'
    _title: 'Documentos de conocimiento'
  requirements:
    _permission: 'edit diagnostic prompt+administer sales leadership diagnostic'
