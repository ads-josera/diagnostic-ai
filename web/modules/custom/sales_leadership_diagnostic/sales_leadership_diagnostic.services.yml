services:
  _defaults:
    autoconfigure: true

  # --- Seguridad -----------------------------------------------------------

  # Punto único de acceso a los secretos del módulo (§29).
  Drupal\sales_leadership_diagnostic\Service\Security\SecretsProvider:
    arguments:
      - '@settings'

  # Consume el identificador del token para que no pueda reutilizarse (§10).
  Drupal\sales_leadership_diagnostic\Service\Security\ReplayGuard:
    arguments:
      - '@keyvalue.expirable'

  # Valida firma, vigencia, emisor, audiencia y unicidad del token SSO.
  Drupal\sales_leadership_diagnostic\Service\Security\SsoTokenValidator:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Security\SecretsProvider'
      - '@Drupal\sales_leadership_diagnostic\Service\Security\ReplayGuard'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.factory'

  # Crea o recupera la cuenta de Drupal del alumno.
  Drupal\sales_leadership_diagnostic\Service\Security\UserProvisioner:
    arguments:
      - '@externalauth.externalauth'
      - '@externalauth.authmap'
      - '@entity_type.manager'
      - '@logger.factory'

  # Comprobación de acceso de las rutas del alumno.
  #
  # No lleva la etiqueta access_check: esa es para requisitos con nombre propio
  # (_mi_check). Una ruta con _custom_access resuelve la llamada a través del
  # contenedor por el identificador del servicio, que aquí es el nombre
  # completo de la clase.
  Drupal\sales_leadership_diagnostic\Access\DiagnosticAccessCheck:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Security\UserProvisioner'
      - '@Drupal\sales_leadership_diagnostic\Service\Authorization\DiagnosticAccessChecker'
      - '@request_stack'

  # Límites de uso por alumno (§44).
  Drupal\sales_leadership_diagnostic\Service\Security\RateLimiter:
    arguments:
      - '@flood'
      - '@config.factory'

  # --- Integración con WordPress -------------------------------------------

  # Firma las peticiones salientes. El contrato es simétrico al del plugin y no
  # debe cambiarse en un solo lado.
  Drupal\sales_leadership_diagnostic\Service\WordPress\HmacSigner:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Security\SecretsProvider'

  # Única clase del módulo que hace peticiones HTTP a WordPress (§8).
  Drupal\sales_leadership_diagnostic\Service\WordPress\WordPressApiClient:
    arguments:
      - '@http_client'
      - '@Drupal\sales_leadership_diagnostic\Service\WordPress\HmacSigner'
      - '@config.factory'
      - '@logger.factory'

  # --- Autorización ---------------------------------------------------------

  Drupal\sales_leadership_diagnostic\Service\Authorization\LearnDashAccessProvider:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\WordPress\WordPressApiClient'
      - '@datetime.time'
      - '@Drupal\sales_leadership_diagnostic\Service\WordPress\PluginVersionTracker'

  # Decorador: envuelve al proveedor real con cache y política de degradación.
  # Al implementar la misma interfaz, quien la consume no sabe si la respuesta
  # viene de la red o de una consulta anterior.
  Drupal\sales_leadership_diagnostic\Service\Authorization\CachedCourseAccessProvider:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Authorization\LearnDashAccessProvider'
      - '@cache.default'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.factory'

  # El resto del módulo depende de la interfaz, no de LearnDash ni de la cache.
  # Cambiar de LMS será escribir otra implementación y mover el proveedor
  # interno del decorador.
  Drupal\sales_leadership_diagnostic\Service\Authorization\CourseAccessProviderInterface: '@Drupal\sales_leadership_diagnostic\Service\Authorization\CachedCourseAccessProvider'

  # Fachada de autorización: el único punto donde una avería se convierte en
  # denegación. Concentrarlo aquí evita que un catch mal escrito en cualquier
  # otro sitio conceda acceso por error.
  Drupal\sales_leadership_diagnostic\Service\Authorization\DiagnosticAccessChecker:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Authorization\CourseAccessProviderInterface'
      - '@config.factory'
      - '@logger.factory'

  # --- Diagnóstico ---------------------------------------------------------

  # Define en un solo sitio qué significa que el módulo esté listo para
  # ejecutar diagnósticos. Lo consultan el informe de estado y el panel.
  Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticReadiness:
    arguments:
      - '@config.factory'
      - '@Drupal\sales_leadership_diagnostic\Service\Security\SecretsProvider'
      - '@Drupal\sales_leadership_diagnostic\Service\Agent\AgentRegistry'

  # La pantalla de «¿sobre qué agente trabajas?». La comparten el Estudio y los
  # Documentos: escrita dos veces, divergió.
  Drupal\sales_leadership_diagnostic\Service\Agent\AgentChooser: {}

  # Las filas del historial del alumno. Lo pintan el panel y la página de cada
  # agente, y por eso no vive dentro de un controller.
  Drupal\sales_leadership_diagnostic\Service\Diagnostic\StudentHistoryBuilder:
    arguments:
      - '@date.formatter'

  # Composición y versionado del prompt del cliente (§18, §57).
  Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticPromptManager:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Knowledge\KnowledgeLibrary'

  # Decide qué se envía al motor, y sobre todo qué no (§31).
  Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticContextBuilder:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Repository\DiagnosticMessageRepository'
      - '@config.factory'
      - '@Drupal\sales_leadership_diagnostic\Service\Research\ResearchEntitlementService'
      - '@Drupal\sales_leadership_diagnostic\Service\Research\TurnClassifier'
      - '@Drupal\sales_leadership_diagnostic\Service\Research\ResearchRuntime'
      - '@Drupal\sales_leadership_diagnostic\Service\Evidence\EvidenceLedger'

  # Valida la respuesta del motor antes de almacenarla (§32).
  Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticResponseValidator:
    arguments:
      - '@logger.factory'

  # --- Motor de IA ---------------------------------------------------------

  Drupal\sales_leadership_diagnostic\Service\Engine\MockDiagnosticEngine:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticResponseValidator'

  Drupal\sales_leadership_diagnostic\Service\Engine\UnavailableDiagnosticEngine:
    class: Drupal\sales_leadership_diagnostic\Service\Engine\UnavailableDiagnosticEngine

  # Unica clase que sabe que el proveedor es OpenAI (§28).
  # Toda la fontaneria de hablar con OpenAI: endpoint, credenciales,
  # reintentos, errores y registro de consumo. No sabe para que se le
  # pregunta, y por eso lo comparten el diagnostico y la memoria.
  Drupal\sales_leadership_diagnostic\Service\Engine\OpenAIClient:
    arguments:
      - '@http_client'
      - '@Drupal\sales_leadership_diagnostic\Service\Security\SecretsProvider'
      - '@config.factory'
      - '@logger.factory'
      - '@Drupal\sales_leadership_diagnostic\Service\Telemetry\AiUsageCollector'
      - '@Drupal\sales_leadership_diagnostic\Service\Telemetry\SpendGuard'

  Drupal\sales_leadership_diagnostic\Service\Engine\OpenAIDiagnosticProvider:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Engine\OpenAIClient'
      - '@Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticResponseValidator'
      - '@Drupal\sales_leadership_diagnostic\Service\Engine\Tool\ToolBoxFactory'

  Drupal\sales_leadership_diagnostic\Service\Engine\DiagnosticEngineFactory:
    arguments:
      - '@settings'
      - '@Drupal\sales_leadership_diagnostic\Service\Engine\MockDiagnosticEngine'
      - '@Drupal\sales_leadership_diagnostic\Service\Engine\UnavailableDiagnosticEngine'
      - '@Drupal\sales_leadership_diagnostic\Service\Engine\OpenAIDiagnosticProvider'

  # El motor activo lo decide la fábrica. El resto del módulo depende de la
  # interfaz y no sabe cuál está en uso (§28).
  sales_leadership_diagnostic.engine:
    class: Drupal\sales_leadership_diagnostic\Service\Engine\DiagnosticEngineInterface
    factory: ['@Drupal\sales_leadership_diagnostic\Service\Engine\DiagnosticEngineFactory', 'create']

  Drupal\sales_leadership_diagnostic\Service\Engine\DiagnosticEngineInterface: '@sales_leadership_diagnostic.engine'

  # --- Conversación --------------------------------------------------------

  # Markdown del agente -> HTML saneado (§25). Sin argumentos a propósito: su
  # configuración de seguridad es interna para que no pueda relajarse desde
  # este archivo sin que se note al revisar la clase.
  Drupal\sales_leadership_diagnostic\Service\Conversation\MarkdownRenderer:
    class: Drupal\sales_leadership_diagnostic\Service\Conversation\MarkdownRenderer

  # Orquestador del turno: es el único sitio que conoce el orden en que
  # ocurren bloqueo, límites, persistencia, motor y cierre (§27).
  Drupal\sales_leadership_diagnostic\Service\Conversation\ConversationService:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Repository\DiagnosticMessageRepository'
      - '@Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticContextBuilder'
      - '@sales_leadership_diagnostic.engine'
      - '@Drupal\sales_leadership_diagnostic\Service\Conversation\MarkdownRenderer'
      - '@Drupal\sales_leadership_diagnostic\Service\Security\RateLimiter'
      - '@lock'
      - '@entity_type.manager'
      - '@queue'
      - '@datetime.time'
      - '@Drupal\sales_leadership_diagnostic\Service\Telemetry\AiUsageCollector'
      - '@Drupal\sales_leadership_diagnostic\Service\Telemetry\AiUsageRepository'
      - '@Drupal\sales_leadership_diagnostic\Service\Telemetry\SpendGuard'
      - '@Drupal\sales_leadership_diagnostic\Service\Engine\Tool\CurrentTurn'
      - '@Drupal\sales_leadership_diagnostic\Service\Research\ResearchEntitlementService'
      - '@Drupal\sales_leadership_diagnostic\Service\Engine\Tool\ToolBoxFactory'
      - '@logger.factory'

  # --- Repositorios --------------------------------------------------------

  # Única puerta de entrada a los mensajes de las conversaciones.
  # Viven en una tabla propia, fuera de Entity API, por privacidad (§43).
  Drupal\sales_leadership_diagnostic\Repository\DiagnosticMessageRepository:
    arguments:
      - '@database'
      - '@datetime.time'

  # Consultas sobre sesiones y resultados. Concentrarlas aquí evita que los
  # controllers construyan entity queries y olviden filtrar por propietario.
  Drupal\sales_leadership_diagnostic\Repository\DiagnosticSessionRepository:
    arguments:
      - '@entity_type.manager'

  Drupal\sales_leadership_diagnostic\Repository\DiagnosticResultRepository:
    arguments:
      - '@entity_type.manager'

  # --- Marca ---------------------------------------------------------------

  # Personalización visual del diagnóstico. Valida los colores antes de
  # emitirlos: acaban dentro de un bloque <style> y un valor arbitrario podría
  # cerrar la declaración e inyectar reglas.
  Drupal\sales_leadership_diagnostic\Service\Branding\Branding:
    arguments:
      - '@config.factory'

  # --- Inicio del diagnóstico ----------------------------------------------

  # Único punto del módulo que crea sesiones. Concentra las cuatro condiciones
  # previas —configuración, autorización, política de repetición y límite de
  # uso— para que no sea posible saltárselas llamando a la ruta directamente.
  Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticStarter:
    arguments:
      - '@entity_type.manager'
      - '@Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticReadiness'
      - '@Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticPromptManager'
      - '@Drupal\sales_leadership_diagnostic\Service\Authorization\DiagnosticAccessChecker'
      - '@Drupal\sales_leadership_diagnostic\Service\Agent\AgentRegistry'
      - '@Drupal\sales_leadership_diagnostic\Service\Memory\StudentMemoryStore'
      - '@Drupal\sales_leadership_diagnostic\Service\Security\UserProvisioner'
      - '@Drupal\sales_leadership_diagnostic\Service\Security\RateLimiter'
      - '@config.factory'
      - '@lock'
      - '@datetime.time'
      - '@Drupal\sales_leadership_diagnostic\Service\Telemetry\SpendGuard'
      - '@Drupal\sales_leadership_diagnostic\Service\Account\AccountHistory'
      - '@logger.factory'

  # Recuerda qué versión del plugin de WordPress respondió por última vez, para
  # que un plugin desactualizado se vea en el informe de estado en lugar de
  # notarse como un comportamiento raro.
  Drupal\sales_leadership_diagnostic\Service\WordPress\PluginVersionTracker:
    arguments:
      - '@state'
      - '@datetime.time'

  # --- Estudio del prompt --------------------------------------------------

  # Borrador del prompt. En estado y no en configuración: el trabajo a medias
  # de alguien no debe exportarse a Git ni desplegarse entre entornos.
  Drupal\sales_leadership_diagnostic\Service\Diagnostic\PromptDraft:
    arguments:
      - '@state'
      - '@datetime.time'

  # Conversaciones de ensayo, aisladas de los datos reales por su marca.
  Drupal\sales_leadership_diagnostic\Service\Diagnostic\SandboxSessionManager:
    arguments:
      - '@entity_type.manager'
      - '@Drupal\sales_leadership_diagnostic\Service\Diagnostic\PromptDraft'
      - '@Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticPromptManager'
      - '@datetime.time'

  Drupal\sales_leadership_diagnostic\Access\SandboxSessionCheck: {}

  # Pantalla que ve el alumno antes de escribir su primer mensaje.
  # La bienvenida sale del AGENTE con el que se conversa, no de un objeto de
  # configuracion unico: cada agente se presenta a si mismo.
  Drupal\sales_leadership_diagnostic\Service\Conversation\ChatWelcome:
    arguments:
      - '@entity_type.manager'
      - '@file_url_generator'

  # Contenido de la portada. El color principal no vive aquí: sale de Marca,
  # para que el azul de la marca se defina en un solo sitio.
  Drupal\sales_leadership_diagnostic\Service\Branding\HomePage:
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@file_url_generator'

  # --- Documentos de conocimiento -------------------------------------------

  Drupal\sales_leadership_diagnostic\Service\Knowledge\DocumentTextExtractor:
    arguments:
      - '@file_system'
      - '@logger.factory'

  Drupal\sales_leadership_diagnostic\Service\Knowledge\KnowledgeLibrary:
    arguments:
      - '@state'
      - '@entity_type.manager'
      - '@Drupal\sales_leadership_diagnostic\Service\Knowledge\DocumentTextExtractor'
      - '@Drupal\sales_leadership_diagnostic\Service\Agent\AgentRegistry'

  # --- Agentes ---------------------------------------------------------------

  # Traduce los cursos que posee el alumno a los agentes que puede usar. La
  # correspondencia vive aqui y no en WordPress a proposito.
  Drupal\sales_leadership_diagnostic\Service\Agent\AgentRegistry:
    arguments:
      - '@entity_type.manager'

  # --- Memoria del alumno ----------------------------------------------------

  # Unico punto por el que se escribe memoria. Mantiene la regla de un hecho
  # por tema y alumno, y ninguna de sus consultas prescinde del uid.
  Drupal\sales_leadership_diagnostic\Service\Memory\StudentMemoryStore:
    arguments:
      - '@entity_type.manager'

  # Relee una conversacion terminada y actualiza la memoria del alumno. Es una
  # llamada al modelo APARTE de la del diagnostico, con prompt propio: la
  # metodologia del agente es del cliente y no se amplia (§15).
  Drupal\sales_leadership_diagnostic\Service\Memory\MemoryExtractor:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Engine\OpenAIClient'
      - '@Drupal\sales_leadership_diagnostic\Service\Memory\StudentMemoryStore'
      - '@Drupal\sales_leadership_diagnostic\Repository\DiagnosticMessageRepository'
      - '@entity_type.manager'
      - '@logger.factory'

  # --- Errores imprevistos ---------------------------------------------------

  # Ultimo recinto: convierte en respuesta presentable lo que ningun controlador
  # esperaba. Solo actua sobre las rutas del modulo.
  Drupal\sales_leadership_diagnostic\EventSubscriber\DiagnosticExceptionSubscriber:
    arguments:
      - '@logger.factory'
    tags:
      - { name: event_subscriber }

  # --- Retencion -------------------------------------------------------------

  # Retira las conversaciones viejas conservando los diagnosticos y la copia
  # del prompt. Es privacidad, no espacio: medido, el modulo entero ocupa
  # menos de 700 KB con diez sesiones.
  Drupal\sales_leadership_diagnostic\Service\Diagnostic\ConversationPurger:
    arguments:
      - '@entity_type.manager'
      - '@Drupal\sales_leadership_diagnostic\Repository\DiagnosticMessageRepository'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.factory'

  # Saca al alumno de las paginas de cuenta de Drupal, que no le sirven de nada
  # y le ofrecen editar una identidad que manda WordPress. Al gestor y a los
  # administradores no les afecta.
  Drupal\sales_leadership_diagnostic\EventSubscriber\StudentProfileRedirectSubscriber:
    arguments:
      - '@current_user'
    tags:
      - { name: event_subscriber }

  # --- Telemetría de consumo -------------------------------------------------

  # Vive lo que dura la petición: el cliente de IA deposita aquí lo que gastó y
  # quien conduce la conversación lo recoge para ponerle nombre.
  Drupal\sales_leadership_diagnostic\Service\Telemetry\AiUsageCollector: {}

  Drupal\sales_leadership_diagnostic\Service\Telemetry\PriceList:
    arguments:
      - '@config.factory'

  Drupal\sales_leadership_diagnostic\Service\Telemetry\AiUsageRepository:
    arguments:
      - '@database'
      - '@Drupal\sales_leadership_diagnostic\Service\Telemetry\PriceList'
      - '@datetime.time'

  # Impide la llamada cuando el presupuesto se agoto. Va ANTES de llamar al
  # proveedor: registrar el exceso despues no es un tope, es un informe.
  Drupal\sales_leadership_diagnostic\Service\Telemetry\SpendGuard:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Telemetry\AiUsageRepository'
      - '@config.factory'
      - '@datetime.time'
      - '@state'
      - '@logger.factory'

  # --- Busqueda externa ------------------------------------------------------

  # Unica frontera con quien busca. Cambiar de proveedor es otra clase y esta
  # linea: la eleccion se tomo con precios de un dia concreto, y esos cambian.
  Drupal\sales_leadership_diagnostic\Service\Search\SearchProviderInterface: '@Drupal\sales_leadership_diagnostic\Service\Search\TavilySearchProvider'

  Drupal\sales_leadership_diagnostic\Service\Search\TavilySearchProvider:
    arguments:
      - '@http_client'
      - '@Drupal\sales_leadership_diagnostic\Service\Security\SecretsProvider'
      - '@config.factory'
      - '@logger.factory'

  # Decide que herramientas hay en cada turno. Es donde entrara el Research
  # Entitlement sin tocar el motor.
  Drupal\sales_leadership_diagnostic\Service\Engine\Tool\ToolBoxFactory:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Search\SearchProviderInterface'
      - '@config.factory'
      - '@logger.factory'
      - '@Drupal\sales_leadership_diagnostic\Service\Engine\Tool\CurrentTurn'
      - '@Drupal\sales_leadership_diagnostic\Service\Engine\Tool\ToolCallRepository'
      - '@Drupal\sales_leadership_diagnostic\Service\Telemetry\SpendGuard'
      - '@Drupal\sales_leadership_diagnostic\Service\Research\ResearchEntitlementService'
      - '@Drupal\sales_leadership_diagnostic\Service\Evidence\EvidenceLedger'
      - '@entity_type.manager'

  # De quien es el turno en curso. El gateway lo necesita DURANTE la llamada,
  # no al terminarla, y esa identidad no puede viajar en lo que se manda al
  # proveedor.
  Drupal\sales_leadership_diagnostic\Service\Engine\Tool\CurrentTurn: {}

  Drupal\sales_leadership_diagnostic\Service\Engine\Tool\ToolCallRepository:
    arguments:
      - '@database'
      - '@datetime.time'

  # --- Research Entitlement --------------------------------------------------

  Drupal\sales_leadership_diagnostic\Service\Research\ResearchEntitlementService:
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.factory'

  # La clase del turno se deduce del estado, nunca se le pregunta al modelo.
  Drupal\sales_leadership_diagnostic\Service\Research\TurnClassifier: {}

  Drupal\sales_leadership_diagnostic\Service\Research\ResearchRuntime: {}

  # --- Evidence Ledger -------------------------------------------------------

  # Lo que ya se sabe, con su procedencia. Cuelga de la PERSONA y sobrevive al
  # cierre de la mision que lo recogio.
  Drupal\sales_leadership_diagnostic\Service\Evidence\EvidenceLedger:
    arguments:
      - '@database'
      - '@config.factory'
      - '@datetime.time'

  # Desatasca conversaciones que se quedaron generando un turno. Sin esto, un
  # proceso que muere a mitad deja la conversacion inutilizable para siempre.
  # Las secciones de la barra del gestor. Vive en un servicio y no en las
  # pestanas de Drupal porque esas solo se pintan en las rutas de aterrizaje, y
  # el gestor se quedaba sin navegacion en cuanto entraba a cualquier sitio.
  Drupal\sales_leadership_diagnostic\Service\Manager\ManagerNavigation:
    arguments:
      - '@current_route_match'

  # Las cuentas de cada alumno semana tras semana y lo que paso con ellas.
  # Sale del Documento 8 del cliente: un registro que solo crece (§4).
  Drupal\sales_leadership_diagnostic\Service\Account\AccountRegistry:
    arguments:
      - '@database'
      - '@datetime.time'
      - '@transliteration'

  # El historial de cuentas que recibe el agente al empezar cada mision. Le da
  # los datos para que aplique SU regla de reciclaje (§26 del Documento 8).
  Drupal\sales_leadership_diagnostic\Service\Account\AccountHistory:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Account\AccountRegistry'

  Drupal\sales_leadership_diagnostic\Hook\StuckTurnHooks:
    arguments:
      - '@entity_type.manager'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.factory'
