services:
  _defaults:
    autoconfigure: true

  # --- Seguridad -----------------------------------------------------------

  # Punto único de acceso a los secretos del módulo (§29).
  Drupal\sales_leadership_diagnostic\Service\Security\SecretsProvider:
    arguments:
      - '@settings'

  # Consume el identificador del token para que no pueda reutilizarse (§10).
  Drupal\sales_leadership_diagnostic\Service\Security\ReplayGuard:
    arguments:
      - '@keyvalue.expirable'

  # Valida firma, vigencia, emisor, audiencia y unicidad del token SSO.
  Drupal\sales_leadership_diagnostic\Service\Security\SsoTokenValidator:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Security\SecretsProvider'
      - '@Drupal\sales_leadership_diagnostic\Service\Security\ReplayGuard'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.factory'

  # Crea o recupera la cuenta de Drupal del alumno.
  Drupal\sales_leadership_diagnostic\Service\Security\UserProvisioner:
    arguments:
      - '@externalauth.externalauth'
      - '@externalauth.authmap'
      - '@entity_type.manager'
      - '@logger.factory'

  # Comprobación de acceso de las rutas del alumno.
  #
  # No lleva la etiqueta access_check: esa es para requisitos con nombre propio
  # (_mi_check). Una ruta con _custom_access resuelve la llamada a través del
  # contenedor por el identificador del servicio, que aquí es el nombre
  # completo de la clase.
  Drupal\sales_leadership_diagnostic\Access\DiagnosticAccessCheck:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Security\UserProvisioner'
      - '@Drupal\sales_leadership_diagnostic\Service\Authorization\DiagnosticAccessChecker'

  # Límites de uso por alumno (§44).
  Drupal\sales_leadership_diagnostic\Service\Security\RateLimiter:
    arguments:
      - '@flood'
      - '@config.factory'

  # --- Integración con WordPress -------------------------------------------

  # Firma las peticiones salientes. El contrato es simétrico al del plugin y no
  # debe cambiarse en un solo lado.
  Drupal\sales_leadership_diagnostic\Service\WordPress\HmacSigner:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Security\SecretsProvider'

  # Única clase del módulo que hace peticiones HTTP a WordPress (§8).
  Drupal\sales_leadership_diagnostic\Service\WordPress\WordPressApiClient:
    arguments:
      - '@http_client'
      - '@Drupal\sales_leadership_diagnostic\Service\WordPress\HmacSigner'
      - '@config.factory'
      - '@logger.factory'

  # --- Autorización ---------------------------------------------------------

  Drupal\sales_leadership_diagnostic\Service\Authorization\LearnDashAccessProvider:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\WordPress\WordPressApiClient'
      - '@datetime.time'
      - '@Drupal\sales_leadership_diagnostic\Service\WordPress\PluginVersionTracker'

  # Decorador: envuelve al proveedor real con cache y política de degradación.
  # Al implementar la misma interfaz, quien la consume no sabe si la respuesta
  # viene de la red o de una consulta anterior.
  Drupal\sales_leadership_diagnostic\Service\Authorization\CachedCourseAccessProvider:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Authorization\LearnDashAccessProvider'
      - '@cache.default'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.factory'

  # El resto del módulo depende de la interfaz, no de LearnDash ni de la cache.
  # Cambiar de LMS será escribir otra implementación y mover el proveedor
  # interno del decorador.
  Drupal\sales_leadership_diagnostic\Service\Authorization\CourseAccessProviderInterface: '@Drupal\sales_leadership_diagnostic\Service\Authorization\CachedCourseAccessProvider'

  # Fachada de autorización: el único punto donde una avería se convierte en
  # denegación. Concentrarlo aquí evita que un catch mal escrito en cualquier
  # otro sitio conceda acceso por error.
  Drupal\sales_leadership_diagnostic\Service\Authorization\DiagnosticAccessChecker:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Authorization\CourseAccessProviderInterface'
      - '@config.factory'
      - '@logger.factory'

  # --- Diagnóstico ---------------------------------------------------------

  # Define en un solo sitio qué significa que el módulo esté listo para
  # ejecutar diagnósticos. Lo consultan el informe de estado y el panel.
  Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticReadiness:
    arguments:
      - '@config.factory'
      - '@Drupal\sales_leadership_diagnostic\Service\Security\SecretsProvider'

  # Composición y versionado del prompt del cliente (§18, §57).
  Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticPromptManager:
    arguments:
      - '@config.factory'

  # Decide qué se envía al motor, y sobre todo qué no (§31).
  Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticContextBuilder:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Repository\DiagnosticMessageRepository'
      - '@config.factory'

  # Valida la respuesta del motor antes de almacenarla (§32).
  Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticResponseValidator:
    class: Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticResponseValidator

  # --- Motor de IA ---------------------------------------------------------

  Drupal\sales_leadership_diagnostic\Service\Engine\MockDiagnosticEngine:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticResponseValidator'

  Drupal\sales_leadership_diagnostic\Service\Engine\UnavailableDiagnosticEngine:
    class: Drupal\sales_leadership_diagnostic\Service\Engine\UnavailableDiagnosticEngine

  # Unica clase que sabe que el proveedor es OpenAI (§28).
  Drupal\sales_leadership_diagnostic\Service\Engine\OpenAIDiagnosticProvider:
    arguments:
      - '@http_client'
      - '@Drupal\sales_leadership_diagnostic\Service\Security\SecretsProvider'
      - '@Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticResponseValidator'
      - '@config.factory'
      - '@logger.factory'

  Drupal\sales_leadership_diagnostic\Service\Engine\DiagnosticEngineFactory:
    arguments:
      - '@settings'
      - '@Drupal\sales_leadership_diagnostic\Service\Engine\MockDiagnosticEngine'
      - '@Drupal\sales_leadership_diagnostic\Service\Engine\UnavailableDiagnosticEngine'
      - '@Drupal\sales_leadership_diagnostic\Service\Engine\OpenAIDiagnosticProvider'

  # El motor activo lo decide la fábrica. El resto del módulo depende de la
  # interfaz y no sabe cuál está en uso (§28).
  sales_leadership_diagnostic.engine:
    class: Drupal\sales_leadership_diagnostic\Service\Engine\DiagnosticEngineInterface
    factory: ['@Drupal\sales_leadership_diagnostic\Service\Engine\DiagnosticEngineFactory', 'create']

  Drupal\sales_leadership_diagnostic\Service\Engine\DiagnosticEngineInterface: '@sales_leadership_diagnostic.engine'

  # --- Conversación --------------------------------------------------------

  # Markdown del agente -> HTML saneado (§25). Sin argumentos a propósito: su
  # configuración de seguridad es interna para que no pueda relajarse desde
  # este archivo sin que se note al revisar la clase.
  Drupal\sales_leadership_diagnostic\Service\Conversation\MarkdownRenderer:
    class: Drupal\sales_leadership_diagnostic\Service\Conversation\MarkdownRenderer

  # Orquestador del turno: es el único sitio que conoce el orden en que
  # ocurren bloqueo, límites, persistencia, motor y cierre (§27).
  Drupal\sales_leadership_diagnostic\Service\Conversation\ConversationService:
    arguments:
      - '@Drupal\sales_leadership_diagnostic\Repository\DiagnosticMessageRepository'
      - '@Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticContextBuilder'
      - '@sales_leadership_diagnostic.engine'
      - '@Drupal\sales_leadership_diagnostic\Service\Conversation\MarkdownRenderer'
      - '@Drupal\sales_leadership_diagnostic\Service\Security\RateLimiter'
      - '@lock'
      - '@entity_type.manager'
      - '@datetime.time'
      - '@logger.factory'

  # --- Repositorios --------------------------------------------------------

  # Única puerta de entrada a los mensajes de las conversaciones.
  # Viven en una tabla propia, fuera de Entity API, por privacidad (§43).
  Drupal\sales_leadership_diagnostic\Repository\DiagnosticMessageRepository:
    arguments:
      - '@database'
      - '@datetime.time'

  # Consultas sobre sesiones y resultados. Concentrarlas aquí evita que los
  # controllers construyan entity queries y olviden filtrar por propietario.
  Drupal\sales_leadership_diagnostic\Repository\DiagnosticSessionRepository:
    arguments:
      - '@entity_type.manager'

  Drupal\sales_leadership_diagnostic\Repository\DiagnosticResultRepository:
    arguments:
      - '@entity_type.manager'

  # --- Marca ---------------------------------------------------------------

  # Personalización visual del diagnóstico. Valida los colores antes de
  # emitirlos: acaban dentro de un bloque <style> y un valor arbitrario podría
  # cerrar la declaración e inyectar reglas.
  Drupal\sales_leadership_diagnostic\Service\Branding\Branding:
    arguments:
      - '@config.factory'

  # --- Inicio del diagnóstico ----------------------------------------------

  # Único punto del módulo que crea sesiones. Concentra las cuatro condiciones
  # previas —configuración, autorización, política de repetición y límite de
  # uso— para que no sea posible saltárselas llamando a la ruta directamente.
  Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticStarter:
    arguments:
      - '@entity_type.manager'
      - '@Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticReadiness'
      - '@Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticPromptManager'
      - '@Drupal\sales_leadership_diagnostic\Service\Authorization\DiagnosticAccessChecker'
      - '@Drupal\sales_leadership_diagnostic\Service\Security\UserProvisioner'
      - '@Drupal\sales_leadership_diagnostic\Service\Security\RateLimiter'
      - '@config.factory'
      - '@lock'
      - '@datetime.time'
      - '@logger.factory'

  # Recuerda qué versión del plugin de WordPress respondió por última vez, para
  # que un plugin desactualizado se vea en el informe de estado en lugar de
  # notarse como un comportamiento raro.
  Drupal\sales_leadership_diagnostic\Service\WordPress\PluginVersionTracker:
    arguments:
      - '@state'
      - '@datetime.time'

  # --- Estudio del prompt --------------------------------------------------

  # Borrador del prompt. En estado y no en configuración: el trabajo a medias
  # de alguien no debe exportarse a Git ni desplegarse entre entornos.
  Drupal\sales_leadership_diagnostic\Service\Diagnostic\PromptDraft:
    arguments:
      - '@state'
      - '@datetime.time'

  # Conversaciones de ensayo, aisladas de los datos reales por su marca.
  Drupal\sales_leadership_diagnostic\Service\Diagnostic\SandboxSessionManager:
    arguments:
      - '@entity_type.manager'
      - '@Drupal\sales_leadership_diagnostic\Service\Diagnostic\PromptDraft'
      - '@Drupal\sales_leadership_diagnostic\Service\Diagnostic\DiagnosticPromptManager'
      - '@datetime.time'

  Drupal\sales_leadership_diagnostic\Access\SandboxSessionCheck: {}

  # Pantalla que ve el alumno antes de escribir su primer mensaje.
  Drupal\sales_leadership_diagnostic\Service\Conversation\ChatWelcome:
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@file_url_generator'

  # Contenido de la portada. El color principal no vive aquí: sale de Marca,
  # para que el azul de la marca se defina en un solo sitio.
  Drupal\sales_leadership_diagnostic\Service\Branding\HomePage:
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@file_url_generator'
